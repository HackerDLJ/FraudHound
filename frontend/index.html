<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FraudHound v0.2</title><style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#27303d;--text:#edf2f7;--muted:#8d9aaa;--red:#ff5c70;--amber:#f5b84b;--green:#55d69b;--cyan:#62c9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,select{font:inherit}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0a0e14;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.brand span{color:var(--cyan)}.sub{color:var(--muted);margin-left:10px;font-size:12px}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #55d69b88}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:18px;background:#0b0f15}.label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:18px 0 8px}.case{padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:8px 0;cursor:pointer}.case:hover{border-color:#445267}.case.active{border-color:var(--cyan);box-shadow:0 0 0 1px #62c9ff22}.badge{display:inline-flex;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700;background:#222b37;color:#cbd5df}.risk-high{color:#ff8a98;background:#3b1720}.risk-med{color:#f6ca71;background:#392c12}.risk-low{color:#67dfaa;background:#123227}.main{padding:22px;max-width:1600px;width:100%;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:18px}select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px}button{cursor:pointer}button.primary{background:#173245;border-color:#28536e;color:#bfe9ff}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.full{grid-column:1/-1}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel2);border:1px solid var(--line);padding:14px;border-radius:10px}.metric .v{font-size:25px;font-weight:800;margin-top:3px}.metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.danger{color:var(--red)}.warning{color:var(--amber)}.safe{color:var(--green)}h2,h3{margin:0 0 12px}h2{font-size:16px}h3{font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.evidence{padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#0e131a}.evidence small{color:var(--muted)}.timeline{max-height:330px;overflow:auto}.event{border-left:2px solid #334050;padding:0 0 13px 13px;margin-left:6px}.event b{font-size:12px}.event small{display:block;color:var(--muted);margin-top:2px}.action{border:1px solid #33566c;background:#10232e;border-radius:10px;padding:14px}.action .name{font-size:20px;font-weight:850;letter-spacing:.5px}.graph{height:300px;background:#0b1017;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}.node{position:absolute;padding:8px 10px;border:1px solid #334050;border-radius:8px;background:#151d27;font-size:11px;min-width:95px;text-align:center}.edge{position:absolute;height:1px;background:#3b4655;transform-origin:left center}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mem{padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.empty{color:var(--muted);padding:20px;text-align:center}.request{border:1px solid #665226;background:#2a2110;padding:13px;border-radius:10px;margin-top:10px}.request strong{color:#f6ca71}@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div><span class="brand">Fraud<span>Hound</span></span><span class="sub">Agentic Fraud Investigation Platform · v0.2</span></div><div class="status"><span class="dot"></span> Graph adapter online</div></header><div class="layout"><aside><div class="label">Demo scenarios</div><button style="width:100%;margin-bottom:6px" onclick="run('high_confidence')">High-confidence fraud</button><button style="width:100%;margin-bottom:6px" onclick="run('ambiguous')">Ambiguous → reassess</button><button style="width:100%" onclick="run('legitimate')">Legitimate transaction</button><div class="label">Cases</div><div id="cases"></div></aside><main class="main"><div class="toolbar"><span id="caseTitle" style="font-weight:800">No investigation selected</span><span style="flex:1"></span><button onclick="refresh()">Refresh</button></div><div id="app" class="empty">Launch a demo investigation to populate the analyst workspace.</div></main></div><script>
let current=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]));
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let x=await r.json();if(!r.ok)throw Error(x.detail||'Request failed');return x}
async function run(scenario){current=await api('/api/investigations',{method:'POST',body:JSON.stringify({scenario,trigger:{source:'demo'}})});render();loadCases()}
async function refresh(){if(current) current=await api('/api/cases/'+current.case_id);render();loadCases()}
async function loadCases(){let xs=await api('/api/cases');$('cases').innerHTML=xs.slice(0,12).map(c=>`<div class="case ${current&&current.case_id===c.case_id?'active':''}" onclick="openCase('${c.case_id}')"><b>${esc(c.case_id)}</b><div style="margin-top:5px"><span class="badge">${esc(c.status)}</span> <span class="badge ${c.risk_assessment?.risk_level==='HIGH'?'risk-high':c.risk_assessment?.risk_level==='MEDIUM'?'risk-med':'risk-low'}">${esc(c.risk_assessment?.risk_level||'—')}</span></div></div>`).join('')||'<div class="empty">No cases yet.</div>'}
async function openCase(id){current=await api('/api/cases/'+id);render();loadCases()}
function render(){if(!current)return;$('caseTitle').textContent=`${current.case_id} · ${current.status}`;let r=current.risk_assessment||{};let riskClass=r.risk_level==='HIGH'||r.risk_level==='CRITICAL'?'danger':r.risk_level==='MEDIUM'?'warning':'safe';let supp=current.evidence.filter(e=>e.polarity==='supporting'), contra=current.evidence.filter(e=>e.polarity==='contradicting');let req=current.evidence_requests.find(x=>x.status==='REQUESTED');let a=current.recommended_actions?.at(-1);$('app').innerHTML=`<div class="metrics"><div class="metric"><div class="k">Risk score</div><div class="v ${riskClass}">${r.risk_score??'—'}</div></div><div class="metric"><div class="k">Risk level</div><div class="v ${riskClass}">${r.risk_level??'—'}</div></div><div class="metric"><div class="k">Confidence</div><div class="v">${r.confidence!=null?Math.round(r.confidence*100)+'%':'—'}</div></div><div class="metric"><div class="k">Iterations</div><div class="v">${current.iterations}</div></div></div><div class="grid" style="margin-top:14px"><section class="card"><h2>Evidence</h2><div class="cols"><div><h3>Supporting</h3>${supp.map(e=>ev(e)).join('')||'<div class="empty">None</div>'}</div><div><h3>Contradicting / validation</h3>${contra.map(e=>ev(e)).join('')||'<div class="empty">None</div>'}</div></div>${req?`<div class="request"><strong>Additional evidence requested</strong><p>${esc(req.reason)}</p><div>${esc(req.question)}</div><button class="primary" onclick="submitEvidence('${req.request_id}')" style="margin-top:9px">Simulate customer authentication</button></div>`:''}</section><section class="card"><h2>Next-best action</h2>${a?`<div class="action"><div class="name">${esc(a.action)}</div><p>${esc(a.reason)}</p><div><span class="badge">Confidence ${Math.round(a.confidence*100)}%</span> <span class="badge">Policy ${esc(a.policy_reference)}</span> <span class="badge">${a.required_approval?'Approval required':'No approval'}</span></div>${a.required_approval&&current.status==='PENDING_APPROVAL'?`<div style="margin-top:10px"><button class="primary" onclick="approve(true)">Approve & simulate</button> <button onclick="approve(false)">Deny</button></div>`:!a.required_approval&&current.status!=='ACTION_EXECUTED'?`<button class="primary" style="margin-top:10px" onclick="executeAction('${a.action}')">Execute / simulate</button>`:''}</div>`:'<div class="empty">No action selected yet.</div>'}<h2 style="margin-top:16px">Uncertainty</h2>${(r.uncertainty||[]).map(x=>`<div class="evidence">${esc(x)}</div>`).join('')||'<div class="evidence">No material uncertainty remains.</div>'}</section><section class="card"><h2>Investigation graph</h2><div id="graph" class="graph">Loading graph…</div></section><section class="card"><h2>Agent timeline</h2><div class="timeline">${(current.timeline||[]).slice().reverse().map(e=>`<div class="event"><b>${esc(e.event)}</b><small>${new Date(e.timestamp).toLocaleTimeString()} · ${esc(e.tool||e.actor)}</small></div>`).join('')}</div></section><section class="card full"><h2>Case memory</h2><div class="memory">${(current.similar_cases||[]).map(x=>`<div class="mem"><b>${esc(x.case_id)}</b><div style="color:var(--cyan);margin:4px 0">Similarity ${Math.round(x.similarity*100)}%</div><small>${esc(x.reason)} · outcome: ${esc(x.outcome||'—')}</small></div>`).join('')||'<div class="empty">No similar cases yet.</div>'}</div></section><section class="card full"><h2>Explainability</h2><p style="color:#cdd5de">${esc(current.explanation||'The agent is still gathering evidence.')}</p></section></div>`;drawGraph()}
function ev(e){return `<div class="evidence"><div>${esc(e.statement)}</div><small>${esc(e.source)} · strength ${Math.round(e.strength*100)}%</small></div>`}
async function drawGraph(){if(!current)return;let g=await api('/api/cases/'+current.case_id+'/graph');let graph=$('graph');if(!graph)return;let pos=[['Customer',10,20],['Account',35,45],['Transaction',60,20],['Device',60,70],['IPAddress',25,75],['Merchant',82,45]];graph.innerHTML=pos.map(([t,x,y])=>{let n=(g.nodes||[]).find(n=>n.type===t);return n?`<div class="node" style="left:${x}%;top:${y}%"><b>${esc(t)}</b><br><span style="color:var(--muted)">${esc(n.id)}</span></div>`:''}).join('')+(g.signals?`<div style="position:absolute;right:10px;top:10px;color:var(--muted);font-size:11px">Shared device: ${g.signals.shared_device_accounts} · Shared IP: ${g.signals.shared_ip_accounts} · Prior fraud: ${g.signals.prior_fraud_connected?'YES':'NO'}</div>`:'')}
async function submitEvidence(id){current=await api('/api/cases/'+current.case_id+'/evidence',{method:'POST',body:JSON.stringify({request_id:id,result:{customer_authenticated:true,channel:'demo'}})});render();loadCases()}
async function approve(ok){current=await api('/api/cases/'+current.case_id+'/approve',{method:'POST',body:JSON.stringify({approved:ok,approver:'demo-analyst',note:'Demo approval'})});render();loadCases()}
async function executeAction(a){current=await api('/api/cases/'+current.case_id+'/action',{method:'POST',body:JSON.stringify({action:a})});render();loadCases()}
loadCases();
</script></body></html>
