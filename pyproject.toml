[project]
name = "fraudhound"
version = "3.0.0"
description = "Agentic AI fraud investigation and next-best-action platform"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pytest>=8,<9",
]

[tool.vercel]
entrypoint = "backend.main:app"
