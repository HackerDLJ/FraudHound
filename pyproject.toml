requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[tool.vercel]
entrypoint = "backend.main:app"
